<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Download — Universal Video Downloader</title>
<meta name="description" content="Share kiye gaye video link ko 4K tak video+audio me download karo. Download API se linked page." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh; color: #fff; padding: 20px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; padding: 24px 0 8px; }
  h1 { font-size: 26px; }
  h1 span { background: linear-gradient(90deg,#ff6a00,#ee0979); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { opacity: .8; font-size: 14px; margin-top: 6px; }
  .card {
    background: rgba(255,255,255,.07); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.15); border-radius: 18px;
    padding: 24px; margin-top: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  label { font-size: 14px; opacity: .9; display: block; margin-bottom: 8px; }
  .row { display: flex; gap: 10px; }
  input[type=url] {
    flex: 1; padding: 14px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.35); color: #fff; font-size: 15px; outline: none; min-width: 0;
  }
  input[type=url]:focus { border-color: #ff6a00; }
  button {
    padding: 14px 22px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(90deg,#ff6a00,#ee0979); transition: transform .1s;
    white-space: nowrap;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 12px; font-size: 14px; min-height: 20px; word-break: break-word; }
  .msg.err { color: #ff8080; } .msg.ok { color: #7dffb0; } .msg.load { color: #ffd166; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right:6px;}
  @keyframes spin { to { transform: rotate(360deg); } }
  #vbox { display: none; margin-top: 16px; background: rgba(0,0,0,.3); border-radius: 14px; padding: 16px; border: 1px solid rgba(255,255,255,.12); }
  #vbox.show { display: block; }
  #thumb { width: 100%; border-radius: 10px; display: none; margin-bottom: 10px; }
  #vtitle { font-size: 16px; font-weight: 600; word-break: break-word; }
  #vmeta { font-size: 13px; opacity: .75; margin-top: 6px; }
  .qrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  select {
    flex: 1; min-width: 160px; padding: 12px; border-radius: 10px; font-size: 14px;
    background: rgba(0,0,0,.4); color: #fff; border: 1px solid rgba(255,255,255,.25); outline: none;
  }
  select option { color: #000; }
  #dprogress { display:none; margin-top:12px; background: rgba(255,255,255,.12); border-radius: 10px; height: 10px; overflow: hidden; }
  #dbar { height: 100%; width: 0%; background: linear-gradient(90deg,#00ff96,#00b8ff); transition: width .2s; }
  .back { display: inline-block; margin-top: 16px; color: #ffd166; font-size: 14px; text-decoration: none; }
  footer { text-align:center; opacity:.55; font-size:12px; margin:24px 0 10px; line-height:1.7;}
  @media (max-width:520px){ .row{flex-direction:column;} button{width:100%;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⬇️ <span>Download Video</span></h1>
    <p class="sub">Ye page <b>Download API</b> (<code>/api/info</code> + <code>/api/download</code>) se linked hai.<br/>Link: <code>download.html?url=VIDEO_LINK&amp;quality=720</code></p>
  </header>

  <div class="card">
    <label for="url">🎬 Video link:</label>
    <div class="row">
      <input id="url" type="url" placeholder="https://..." autocomplete="off" />
    </div>
    <div class="qrow">
      <select id="quality" title="Quality (video+audio merged)">
        <option value="best">Best Quality ⭐ (up to 4K)</option>
        <option value="2160">2160p 4K Ultra HD</option>
        <option value="1440">1440p 2K Quad HD</option>
        <option value="1080">1080p Full HD</option>
        <option value="720" selected>720p HD</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="audio">Audio only (MP3)</option>
      </select>
      <button id="dlBtn" style="flex:1;">⬇️ Download</button>
    </div>
    <div class="msg" id="msg"></div>

    <div id="vbox">
      <img id="thumb" alt="thumbnail" />
      <div id="vtitle"></div>
      <div id="vmeta"></div>
      <div id="dprogress"><div id="dbar"></div></div>
      <div class="msg" id="dlmsg"></div>
    </div>

    <a class="back" href="index.html">← Back to Video Downloader</a>
  </div>

  <footer>Sirf apne ya copyright-free videos download karo. ⚖️</footer>
</div>

<!-- IN-BUILD API: docs/config.js se aata hai, user ko kuch nahi karna -->
<script src="./config.js"></script>
<script>
// ZERO-CONFIG API (in-build) — ?api= > saved > config.js DEFAULT > same-origin
const DEFAULT_API = ((typeof window.VD_DEFAULT_API === 'string' ? window.VD_DEFAULT_API : '') || '').trim().replace(/\/+$/, '');
const getQueryApi = () => { try { return (new URLSearchParams(location.search).get('api') || '').trim().replace(/\/+$/, ''); } catch { return ''; } };
const getSavedApi = () => { try { return (localStorage.getItem('vd_api_base') || '').trim().replace(/\/+$/, ''); } catch { return ''; } };
let ACTIVE_API = getQueryApi() || getSavedApi() || DEFAULT_API || '';
try { if (getQueryApi()) localStorage.setItem('vd_api_base', getQueryApi()); } catch {}
const apiBase = () => ACTIVE_API;
const api = (path) => ACTIVE_API + path;

function apiCandidates(path) {
  const list = [ACTIVE_API + path];
  if (DEFAULT_API && DEFAULT_API !== ACTIVE_API) list.push(DEFAULT_API + path);
  if (ACTIVE_API !== '') list.push(path);
  // Local fallback: file:// double-click karne par bhi local backend pakad lega
  // (https page par http fallback block hota hai, isliye skip)
  try {
    if (location.protocol !== 'https:') {
      for (const base of ['http://localhost:3000', 'http://127.0.0.1:3000']) {
        if (base !== ACTIVE_API && base !== DEFAULT_API) list.push(base + path);
      }
    }
  } catch {}
  return [...new Set(list)];
}
async function apiPostInfo(url) {
  let lastErr = null;
  for (const u of apiCandidates('/api/info')) {
    try {
      const r = await fetch(u, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { ACTIVE_API = u.replace(/\/api\/info$/, ''); return d; }
      lastErr = new Error(d.error || ('Server error (' + r.status + ')'));
      if (r.status === 400 || r.status === 404) throw lastErr;
    } catch (e) { lastErr = e; if (e && /^(Sahi video|Ye video|Ye link)/.test(e.message)) throw e; }
  }
  throw lastErr || new Error('Server se connect nahi ho paya');
}
async function apiGetDownload(url, q) {
  let lastErr = null;
  for (const u of apiCandidates('/api/download')) {
    try {
      const full = u + '?url=' + encodeURIComponent(url) + '&quality=' + encodeURIComponent(q);
      const r = await fetch(full);
      if (r.ok) { ACTIVE_API = u.replace(/\/api\/download$/, ''); return r; }
      const t = await r.text().catch(() => '');
      lastErr = new Error(t || 'Download fail ho gaya');
      if (r.status === 400 || r.status === 404) throw lastErr;
    } catch (e) { lastErr = e; if (e && /^(Sahi video)/.test(e.message)) throw e; }
  }
  throw lastErr || new Error('Download fail ho gaya');
}

const $ = (id) => document.getElementById(id);
const urlInput = $('url'), msg = $('msg'), vbox = $('vbox'),
      thumb = $('thumb'), vtitle = $('vtitle'), vmeta = $('vmeta'),
      quality = $('quality'), dlmsg = $('dlmsg'),
      dprogress = $('dprogress'), dbar = $('dbar');

function setMsg(t, cls) { msg.className = 'msg ' + (cls || ''); msg.innerHTML = t; }

// Backend fail hint (in-build — user setting nahi)
function apiHint() {
  if (!DEFAULT_API && !ACTIVE_API) return ' 💡 Server OFF lag raha hai — start.bat chalao (server ON rakho), phir retry karo.';
  return '';
}

function rebuildQualities(list, prev) {
  if (!Array.isArray(list) || !list.length) return prev;
  quality.innerHTML = '';
  for (const q of list) {
    const o = document.createElement('option');
    o.value = q.id; o.textContent = q.label || q.id;
    quality.appendChild(o);
  }
  const keep = list.some((q) => q.id === prev) ? prev : (list.some((q) => q.id === '720') ? '720' : list[0].id);
  quality.value = keep;
  return keep;
}

async function downloadNow() {
  const url = urlInput.value.trim();
  if (!url || !/^https?:\/\//i.test(url)) { setMsg('❌ Sahi video link do (https://...)', 'err'); return; }
  const q0 = quality.value || '720';
  $('dlBtn').disabled = true;
  vbox.classList.remove('show');
  try {
    // STEP 1: /api/info (in-build backend, auto-fallback)
    setMsg('<span class="spinner"></span>Video info li ja rahi hai...', 'load');
    const d = await apiPostInfo(url);

    const q = rebuildQualities(d.qualities, q0);
    vtitle.textContent = d.title || 'Video';
    const mine = (d.qualities || []).find((x) => x.id === q);
    const badge4k = (d.maxHeight && d.maxHeight >= 2000) ? '  •  🎬 4K available' : '';
    vmeta.textContent = (d.uploader ? '👤 ' + d.uploader + '  •  ' : '') + '⏱️ ' + (d.durationText || '')
      + ((mine && mine.sizeText) ? '  •  📦 ~' + mine.sizeText : '') + badge4k;
    if (d.thumbnail) { thumb.src = d.thumbnail; thumb.style.display = 'block'; }
    else thumb.style.display = 'none';
    vbox.classList.add('show');

    // STEP 2: /api/download (in-build backend, auto-fallback)
    dlmsg.className = 'msg load';
    dlmsg.innerHTML = '<span class="spinner"></span>Download ho raha hai... page band mat karo ⏳';
    dprogress.style.display = 'block'; dbar.style.width = '10%';
    setMsg('✅ Video mil gaya! Download ho raha hai...', 'ok');

    const r = await apiGetDownload(url, q);

    let fname = 'video' + (q === 'audio' ? '.mp3' : '.mp4');
    const cd = r.headers.get('Content-Disposition');
    if (cd) {
      const m = cd.match(/filename\*=UTF-8''(.+)/) || cd.match(/filename="(.+)"/);
      if (m) fname = decodeURIComponent(m[1]);
    }
    const total = +(r.headers.get('Content-Length') || 0);
    const reader = r.body.getReader();
    const chunks = [];
    let got = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      dbar.style.width = total ? Math.min(99, (got / total) * 100) + '%' : Math.min(95, got / 500000) + '%';
    }
    dbar.style.width = '100%';
    const blob = new Blob(chunks, { type: q === 'audio' ? 'audio/mpeg' : 'video/mp4' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    dlmsg.className = 'msg ok';
    dlmsg.textContent = '✅ Download ho gaya! File check karo: ' + fname;
  } catch (e) {
    setMsg('❌ ' + e.message + apiHint(), 'err');
    vbox.classList.add('show');
    dlmsg.className = 'msg err';
    dlmsg.textContent = '❌ ' + e.message;
  } finally {
    $('dlBtn').disabled = false;
    setTimeout(() => { dprogress.style.display = 'none'; dbar.style.width = '0%'; }, 3000);
  }
}

$('dlBtn').onclick = downloadNow;
urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') downloadNow(); });

// ?url= & ?quality= se prefill + auto-start
(function boot() {
  try {
    const p = new URLSearchParams(location.search);
    const u = p.get('url'), q = p.get('quality');
    if (u) urlInput.value = u;
    if (q) quality.value = q;
    if (u && p.get('auto') !== '0') downloadNow();
  } catch {}
})();
</script>
</body>
</html>
