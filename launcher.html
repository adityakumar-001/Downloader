<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Downloader — Launcher</title>
<!-- Redirects only when the server is ON (otherwise help stays on this page) -->
<style>
  body { font-family: system-ui, sans-serif; background: #14122b; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
  .box { max-width: 480px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.15); border-radius: 16px; padding: 28px; }
  .logo { font-size: 48px; }
  h1 { font-size: 22px; margin: 10px 0; }
  p { font-size: 14px; opacity: .9; line-height: 1.7; }
  a { color: #ffd166; }
  .btn { display: inline-block; margin-top: 14px; padding: 12px 24px; border-radius: 10px; background: linear-gradient(90deg,#ff6a00,#ee0979); color: #fff; text-decoration: none; font-weight: 700; }
  code { background: rgba(0,0,0,.5); padding: 2px 8px; border-radius: 6px; font-size: 13px; }
  #status { margin-top: 12px; font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">📥</div>
  <h1>Opening Video Downloader...</h1>
  <p>Opening the app: <a href="http://localhost:3000/">http://localhost:3000</a></p>
  <a class="btn" id="openBtn" href="http://localhost:3000/">▶️ Open App</a>
  <div><button class="btn" id="retryBtn" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);margin-top:10px;cursor:pointer;">🔄 Check again</button></div>
  <div id="status">🔄 Checking server...</div>
  <p id="help" style="display:none; margin-top:14px;">🔴 The server looks OFF.<br/>First double-click <code>start.bat</code> (keep the black window open),<br/>then come back and press <b>Check again</b>.</p>
</div>
<script>
  // Check the server first, redirect only when ON — otherwise show help on this page.
  // Both localhost and 127.0.0.1 are tried (one of them can fail to resolve
  // on some Windows network setups while the other works).
  var APPS = ['http://localhost:3000/', 'http://127.0.0.1:3000/'];
  var APP = APPS[0];
  var tries = 0;
  async function checkOnce() {
    for (var i = 0; i < APPS.length; i++) {
      try {
        var ctrl = new AbortController();
        var t = setTimeout(function () { ctrl.abort(); }, 3000);
        var r = await fetch(APPS[i] + 'api/health', { signal: ctrl.signal });
        clearTimeout(t);
        if (r.ok) { APP = APPS[i]; return true; }
      } catch (e) { /* try the next address */ }
    }
    return false;
  }
  async function check(autoGo) {
    var el = document.getElementById('status');
    var help = document.getElementById('help');
    el.textContent = '🔄 Checking server... (attempt ' + (tries + 1) + ')';
    var ok = await checkOnce();
    if (ok) {
      el.textContent = '🟢 Server is running — opening the app...';
      setTimeout(function () { location.replace(APP + location.search + location.hash); }, 600);
    } else {
      tries++;
      if (autoGo && tries < 15) { setTimeout(function () { check(true); }, 2000); return; }
      el.textContent = '🔴 Server is OFF — follow the steps below.';
      help.style.display = 'block';
    }
  }
  document.getElementById('retryBtn').onclick = function () { tries = 0; document.getElementById('help').style.display = 'none'; check(false); };
  check(true); // auto-retry for 30 sec on open (catches the server while it starts)
</script>
</body>
</html>
